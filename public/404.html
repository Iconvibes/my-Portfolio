<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — page not found | Ferdinard Ashonibare</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="This page could not be found. Head back to the homepage of Ferdinard Ashonibare, full-stack web developer in Lagos, Nigeria." />
    <meta name="theme-color" content="#060A12" />
    <style>
      /* Self-hosted fonts — same files as the main site (public/fonts). Inter
         and JetBrains Mono are served by Google as a single file across these
         weights, and Syne maps both 700/800 to one file, so these three
         @font-face rules cover everything this page renders. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/inter-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(/fonts/inter-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(/fonts/inter-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/inter-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/jetbrains-mono-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(/fonts/jetbrains-mono-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Syne';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/syne-latin-700.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Syne';
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url(/fonts/syne-latin-700.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --ink: #060a12;
        --ink-2: #0b1220;
        --line: rgba(148, 163, 184, 0.14);
        --signal: #c8f135;
        --signal-ink: #1a2600;
        --slate: #94a3b8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--ink);
        color: #f8fafc;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, rgba(148,163,184,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148,163,184,0.05) 1px, transparent 1px);
        background-size: 52px 52px;
      }
      .glow {
        position: absolute; inset: 0;
        background: radial-gradient(circle at top right, rgba(200,241,53,0.06), transparent 34%),
                    radial-gradient(circle at bottom left, rgba(56,130,246,0.07), transparent 40%);
      }
      .card { position: relative; max-width: 480px; padding: 3rem 2rem; text-align: center; }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--signal);
      }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--slate); line-height: 1.9; text-align: left; display: inline-block; margin: 1.6rem 0 2.2rem; }
      .code b { color: #f8fafc; font-weight: 600; }
      h1 {
        font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: -0.02em;
        font-size: clamp(2.6rem, 8vw, 3.6rem); line-height: 1.05; margin-top: 0.9rem;
      }
      h1 em { font-style: normal; color: var(--signal); }
      p.sub { color: var(--slate); font-size: 0.95rem; line-height: 1.7; margin-top: 1rem; }
      .btn {
        display: inline-flex; align-items: center; gap: 0.5rem;
        margin-top: 2rem; padding: 0.85rem 1.6rem; border-radius: 999px;
        background: var(--signal); color: var(--signal-ink);
        font-weight: 600; font-size: 0.9rem; text-decoration: none;
        border: 1px solid var(--signal);
        transition: background 0.2s ease, color 0.2s ease;
      }
      .btn:hover { background: transparent; color: var(--signal); }
      .alt { display: block; margin-top: 1.2rem; color: var(--slate); font-size: 0.8rem; text-decoration: none; }
      .alt:hover { color: #f8fafc; }
    </style>
  </head>
  <body>
    <div class="grid" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <main class="card">
      <p class="mono">// error — status</p>
      <h1>404 <em>not found</em></h1>
      <div class="code">
        $ ls -la ~/pages<br />
        ls: cannot access '<b>this-path</b>': No such file or directory<br />
        $ echo "let's get you home"<br />
        <span style="color: var(--signal)">let's get you home</span>
      </div>
      <p class="sub">
        The page you're looking for doesn't exist — or it moved. The work is still here.
      </p>
      <a class="btn" href="/">← back to homepage</a>
      <a class="alt" href="/work">or browse the work</a>
    </main>
  </body>
</html>
