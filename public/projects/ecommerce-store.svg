<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#881337"/>
      <stop offset="0.5" stop-color="#be123c"/>
      <stop offset="1" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdf2f4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="#fdf2f4"/>

  <!-- Navbar -->
  <rect x="0" y="0" width="1280" height="72" fill="#ffffff"/>
  <rect x="0" y="70" width="1280" height="2" fill="#fbe4e8"/>
  <text x="48" y="46" font-size="22" font-weight="700" fill="#4c0519">Market<span fill="#e11d48">.</span></text>
  <text x="190" y="46" font-size="14.5" fill="#6b1d33">Shop</text>
  <text x="262" y="46" font-size="14.5" fill="#6b1d33">Categories</text>
  <text x="372" y="46" font-size="14.5" fill="#6b1d33">Deals</text>
  <text x="452" y="46" font-size="14.5" fill="#6b1d33">Sell here</text>
  <rect x="560" y="17" width="340" height="38" rx="19" fill="#fdf2f4" stroke="#f0cdd6"/>
  <text x="584" y="41" font-size="13.5" fill="#a25b6f">Search products, brands, stores…</text>
  <circle cx="944" cy="36" r="17" fill="#fff1f2" stroke="#f0cdd6"/>
  <path d="M934 36h6m-3-3v6" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
  <rect x="986" y="14" width="90" height="44" rx="22" fill="url(#btn)"/>
  <text x="1018" y="41" font-size="14" font-weight="700" fill="#ffffff">Cart</text>
  <circle cx="1064" cy="20" r="11" fill="#fde68a"/>
  <text x="1064" y="24" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c0519">3</text>

  <!-- Hero banner -->
  <rect x="48" y="100" width="1184" height="150" rx="18" fill="url(#hero)"/>
  <text x="84" y="150" font-size="13" letter-spacing="4" fill="#fecdd3">SPRING SALE</text>
  <text x="82" y="196" font-size="34" font-weight="700" fill="#fff1f2">Up to 40% off across every store</text>
  <text x="84" y="226" font-size="15" fill="#fda4af">Shop hundreds of vendors on one checkout — delivered in days.</text>
  <rect x="1030" y="140" width="168" height="52" rx="26" fill="#ffffff"/>
  <text x="1066" y="172" font-size="15" font-weight="700" fill="#be123c">Shop the sale</text>

  <!-- Category strip -->
  <text x="48" y="300" font-size="16" font-weight="700" fill="#4c0519">Shop by category</text>
  <g>
    <rect x="48" y="316" width="184" height="74" rx="12" fill="#ffffff" stroke="#f0cdd6"/>
    <text x="140" y="356" text-anchor="middle" font-size="13.5" fill="#6b1d33">Fashion</text>
    <rect x="246" y="316" width="184" height="74" rx="12" fill="#ffffff" stroke="#f0cdd6"/>
    <text x="338" y="356" text-anchor="middle" font-size="13.5" fill="#6b1d33">Electronics</text>
    <rect x="444" y="316" width="184" height="74" rx="12" fill="#ffffff" stroke="#f0cdd6"/>
    <text x="536" y="356" text-anchor="middle" font-size="13.5" fill="#6b1d33">Home &amp; Living</text>
    <rect x="642" y="316" width="184" height="74" rx="12" fill="#ffffff" stroke="#f0cdd6"/>
    <text x="734" y="356" text-anchor="middle" font-size="13.5" fill="#6b1d33">Beauty</text>
    <rect x="840" y="316" width="184" height="74" rx="12" fill="#ffffff" stroke="#f0cdd6"/>
    <text x="932" y="356" text-anchor="middle" font-size="13.5" fill="#6b1d33">Gadgets</text>
    <rect x="1038" y="316" width="194" height="74" rx="12" fill="#ffffff" stroke="#f0cdd6"/>
    <text x="1135" y="356" text-anchor="middle" font-size="13.5" fill="#6b1d33">More</text>
  </g>

  <!-- Product grid -->
  <text x="48" y="440" font-size="16" font-weight="700" fill="#4c0519">Trending now</text>
  <g>
    <!-- Product 1 -->
    <rect x="48" y="456" width="280" height="288" rx="16" fill="url(#card)" stroke="#f0cdd6"/>
    <rect x="64" y="472" width="248" height="150" rx="10" fill="#ffe4e6"/>
    <rect x="64" y="472" width="248" height="150" rx="10" fill="url(#hero)" opacity="0.28"/>
    <circle cx="188" cy="547" r="34" fill="#ffffff"/>
    <text x="188" y="557" text-anchor="middle" font-size="20" fill="#be123c">🛍</text>
    <text x="80" y="652" font-size="15.5" font-weight="700" fill="#3f0d1f">Wireless Headphones</text>
    <text x="80" y="676" font-size="13.5" fill="#a25b6f">by SoundHub</text>
    <text x="80" y="710" font-size="17" font-weight="700" fill="#be123c">₦38,500</text>
    <rect x="196" y="692" width="104" height="40" rx="20" fill="#4c0519"/>
    <text x="222" y="717" font-size="13" font-weight="700" fill="#ffffff">Add to cart</text>

    <!-- Product 2 -->
    <rect x="348" y="456" width="280" height="288" rx="16" fill="url(#card)" stroke="#f0cdd6"/>
    <rect x="364" y="472" width="248" height="150" rx="10" fill="#fce7f3"/>
    <rect x="364" y="472" width="248" height="150" rx="10" fill="#be123c" opacity="0.18"/>
    <circle cx="488" cy="547" r="34" fill="#ffffff"/>
    <text x="488" y="557" text-anchor="middle" font-size="20" fill="#be123c">👟</text>
    <text x="380" y="652" font-size="15.5" font-weight="700" fill="#3f0d1f">Runner Sneakers</text>
    <text x="380" y="676" font-size="13.5" fill="#a25b6f">by StepCo</text>
    <text x="380" y="710" font-size="17" font-weight="700" fill="#be123c">₦52,000</text>
    <rect x="496" y="692" width="104" height="40" rx="20" fill="#4c0519"/>
    <text x="522" y="717" font-size="13" font-weight="700" fill="#ffffff">Add to cart</text>

    <!-- Product 3 -->
    <rect x="648" y="456" width="280" height="288" rx="16" fill="url(#card)" stroke="#f0cdd6"/>
    <rect x="664" y="472" width="248" height="150" rx="10" fill="#fff1f2"/>
    <rect x="664" y="472" width="248" height="150" rx="10" fill="#e11d48" opacity="0.14"/>
    <circle cx="788" cy="547" r="34" fill="#ffffff"/>
    <text x="788" y="557" text-anchor="middle" font-size="20" fill="#be123c">⌚</text>
    <text x="680" y="652" font-size="15.5" font-weight="700" fill="#3f0d1f">Smart Watch Series</text>
    <text x="680" y="676" font-size="13.5" fill="#a25b6f">by PulseTech</text>
    <text x="680" y="710" font-size="17" font-weight="700" fill="#be123c">₦74,900</text>
    <rect x="796" y="692" width="104" height="40" rx="20" fill="#4c0519"/>
    <text x="822" y="717" font-size="13" font-weight="700" fill="#ffffff">Add to cart</text>

    <!-- Product 4 -->
    <rect x="948" y="456" width="284" height="288" rx="16" fill="url(#card)" stroke="#f0cdd6"/>
    <rect x="964" y="472" width="252" height="150" rx="10" fill="#fee2e2"/>
    <rect x="964" y="472" width="252" height="150" rx="10" fill="#be123c" opacity="0.22"/>
    <circle cx="1090" cy="547" r="34" fill="#ffffff"/>
    <text x="1090" y="557" text-anchor="middle" font-size="20" fill="#be123c">👜</text>
    <text x="980" y="652" font-size="15.5" font-weight="700" fill="#3f0d1f">Leather Tote Bag</text>
    <text x="980" y="676" font-size="13.5" fill="#a25b6f">by Maison K</text>
    <text x="980" y="710" font-size="17" font-weight="700" fill="#be123c">₦96,000</text>
    <rect x="1100" y="692" width="104" height="40" rx="20" fill="#4c0519"/>
    <text x="1126" y="717" font-size="13" font-weight="700" fill="#ffffff">Add to cart</text>
  </g>

  <!-- Footer bar -->
  <rect x="0" y="768" width="1280" height="32" fill="#4c0519"/>
  <text x="48" y="788" font-size="12" fill="#fda4af">Multi-vendor marketplace · Secure checkout · Fast delivery</text>
</svg>
