<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f2d"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38e0f5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Faint grid -->
  <g stroke="#16354a" stroke-width="1" opacity="0.35">
    <path d="M0 160h1280M0 320h1280M0 480h1280M0 640h1280"/>
    <path d="M320 0v800M640 0v800M960 0v800"/>
  </g>

  <!-- Nav -->
  <rect x="0" y="0" width="1280" height="72" fill="#0b1826"/>
  <rect x="40" y="20" width="34" height="34" rx="9" fill="url(#cyan)"/>
  <g stroke="#06222e" stroke-width="3" stroke-linecap="round">
    <rect x="49" y="31" width="13" height="10" rx="2" fill="#06222e" stroke="none"/>
    <path d="M62 33h5l4 4v4h-9z" fill="none"/>
    <circle cx="53" cy="45" r="2.6" fill="#06222e" stroke="none"/>
    <circle cx="66" cy="45" r="2.6" fill="#06222e" stroke="none"/>
  </g>
  <text x="88" y="37" font-size="17" font-weight="700" fill="#eaf7ff">TPC Logistics</text>
  <text x="88" y="53" font-size="10.5" letter-spacing="2" fill="#4f7c96">DELIVERY &amp; FREIGHT</text>

  <g font-size="13.5" fill="#7fa3ba">
    <text x="880" y="44">Services</text>
    <text x="975" y="44">Tracking</text>
    <text x="1072" y="44">About</text>
  </g>
  <rect x="1150" y="18" width="120" height="36" rx="18" fill="url(#cyan)"/>
  <text x="1174" y="41" font-size="13.5" font-weight="700" fill="#06222e">Request a quote</text>

  <!-- Hero -->
  <text x="60" y="150" font-size="13" letter-spacing="3" fill="#38e0f5">// LOGISTICS MADE SIMPLE</text>
  <text x="60" y="210" font-size="44" font-weight="800" fill="#f2fafd">Deliveries that arrive</text>
  <text x="60" y="262" font-size="44" font-weight="800" fill="#f2fafd">on time, <tspan fill="#38e0f5">every time.</tspan></text>
  <text x="60" y="308" font-size="16" fill="#8fb2c8">From pickup to drop-off — request a delivery in seconds,</text>
  <text x="60" y="332" font-size="16" fill="#8fb2c8">track it live, and stay in the loop on WhatsApp.</text>

  <rect x="60" y="372" width="178" height="48" rx="24" fill="url(#cyan)"/>
  <text x="86" y="401" font-size="14.5" font-weight="700" fill="#06222e">Request a pickup</text>
  <rect x="254" y="372" width="186" height="48" rx="24" fill="#0f2436" stroke="#2c5c78"/>
  <circle cx="286" cy="396" r="14" fill="#25d366"/>
  <path d="M280 392l7 6 10-10" stroke="#06222e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="312" y="401" font-size="14.5" font-weight="700" fill="#eaf7ff">WhatsApp us</text>

  <!-- Truck panel -->
  <rect x="610" y="110" width="610" height="400" rx="22" fill="#0c1c2b" stroke="#1d4057"/>
  <text x="640" y="150" font-size="12.5" letter-spacing="2" fill="#4f7c96">LIVE DISPATCH — TRACKING</text>
  <path d="M640 180h150M640 212h150" stroke="#1d4057" stroke-width="6" stroke-linecap="round"/>
  <path d="M640 180h90M640 212h120" stroke="#38e0f5" stroke-width="6" stroke-linecap="round"/>

  <g transform="translate(660 260)">
    <rect x="0" y="0" width="300" height="120" rx="12" fill="#112a3d"/>
    <rect x="18" y="18" width="150" height="84" rx="8" fill="#1b3d55"/>
    <path d="M150 30h64l18 22v42h-82z" fill="#0b2333" stroke="#38e0f5" stroke-width="3"/>
    <rect x="168" y="52" width="26" height="14" rx="3" fill="#38e0f5" opacity="0.85"/>
    <circle cx="52" cy="118" r="14" fill="#0b2333" stroke="#38e0f5" stroke-width="4"/>
    <circle cx="196" cy="118" r="14" fill="#0b2333" stroke="#38e0f5" stroke-width="4"/>
    <text x="240" y="40" font-size="12" fill="#38e0f5">EN ROUTE</text>
  </g>
  <g font-size="14" fill="#7fa3ba">
    <text x="660" y="450">Pickup — Ikeja</text>
    <text x="880" y="450">Drop-off — Victoria Island</text>
  </g>
  <g font-size="13" fill="#38e0f5">
    <text x="660" y="480">ETA 14:32</text>
    <text x="880" y="480">2.4 km away</text>
  </g>

  <!-- Stats -->
  <g text-anchor="middle">
    <text x="170" y="560" font-size="34" font-weight="800" fill="#f2fafd">24/7</text>
    <text x="170" y="584" font-size="12.5" letter-spacing="1.5" fill="#4f7c96">DISPATCH</text>
    <text x="330" y="560" font-size="34" font-weight="800" fill="#f2fafd">40+</text>
    <text x="330" y="584" font-size="12.5" letter-spacing="1.5" fill="#4f7c96">ACTIVE ROUTES</text>
    <text x="490" y="560" font-size="34" font-weight="800" fill="#f2fafd">98%</text>
    <text x="490" y="584" font-size="12.5" letter-spacing="1.5" fill="#4f7c96">ON-TIME</text>
  </g>

  <!-- Services -->
  <rect x="60" y="620" width="360" height="130" rx="16" fill="#0c1c2b" stroke="#1d4057"/>
  <text x="84" y="662" font-size="16" font-weight="700" fill="#eaf7ff">Pickup &amp; Delivery</text>
  <text x="84" y="690" font-size="13" fill="#7fa3ba">Book a pickup in seconds — same-day</text>
  <text x="84" y="712" font-size="13" fill="#7fa3ba">delivery across the city.</text>

  <rect x="460" y="620" width="360" height="130" rx="16" fill="#0c1c2b" stroke="#1d4057"/>
  <text x="484" y="662" font-size="16" font-weight="700" fill="#eaf7ff">Real-time Tracking</text>
  <text x="484" y="690" font-size="13" fill="#7fa3ba">Follow every delivery live — driver,</text>
  <text x="484" y="712" font-size="13" fill="#7fa3ba">route, and ETA at a glance.</text>

  <rect x="860" y="620" width="360" height="130" rx="16" fill="#0c1c2b" stroke="#1d4057"/>
  <text x="884" y="662" font-size="16" font-weight="700" fill="#eaf7ff">Warehousing &amp; Storage</text>
  <text x="884" y="690" font-size="13" fill="#7fa3ba">Secure short-term storage with flexible</text>
  <text x="884" y="712" font-size="13" fill="#7fa3ba">dispatch schedules for businesses.</text>
</svg>
