<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3327"/>
      <stop offset="0.55" stop-color="#0a1a24"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2230" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a1520" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="213" y1="0" x2="213" y2="800"/><line x1="427" y1="0" x2="427" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/><line x1="853" y1="0" x2="853" y2="800"/>
    <line x1="1067" y1="0" x2="1067" y2="800"/>
  </g>

  <!-- Navbar -->
  <rect x="0" y="0" width="1280" height="76" fill="#060a12" fill-opacity="0.55"/>
  <rect x="48" y="20" width="36" height="36" rx="9" fill="url(#shield)"/>
  <path d="M66 31l9 3v7c0 5.5-3.6 9.2-9 11-5.4-1.8-9-5.5-9-11v-7z" fill="#06251a"/>
  <text x="96" y="42" font-size="19" font-weight="700" fill="#ffffff">So-Safe Corps</text>
  <text x="290" y="42" font-size="13.5" fill="#8fb3a4">Ogun State Security Organisation</text>
  <text x="700" y="42" font-size="14" fill="#a8c3b7">Home</text>
  <text x="772" y="42" font-size="14" fill="#a8c3b7">About</text>
  <text x="850" y="42" font-size="14" fill="#a8c3b7">Services</text>
  <text x="952" y="42" font-size="14" fill="#a8c3b7">Contact</text>
  <rect x="1032" y="17" width="200" height="42" rx="21" fill="#4ade80"/>
  <text x="1052" y="43" font-size="14" font-weight="700" fill="#06251a">Report an Incident</text>

  <!-- Hero -->
  <text x="48" y="210" font-size="15" font-weight="700" letter-spacing="3" fill="#4ade80">SAFETY · DUTY · SERVICE</text>
  <text x="48" y="280" font-size="54" font-weight="700" fill="#ffffff">Protecting lives,<tspan x="48" dy="62">property &amp; public trust.</tspan></text>
  <rect x="48" y="400" width="560" height="10" rx="5" fill="#274b3c"/>
  <rect x="48" y="424" width="440" height="10" rx="5" fill="#1c3a2e"/>
  <rect x="48" y="448" width="500" height="10" rx="5" fill="#1c3a2e"/>

  <rect x="48" y="496" width="176" height="50" rx="25" fill="#4ade80"/>
  <text x="82" y="527" font-size="15" font-weight="700" fill="#06251a">Get Assistance</text>
  <rect x="240" y="496" width="164" height="50" rx="25" fill="none" stroke="#8fb3a4" stroke-opacity="0.6"/>
  <text x="278" y="527" font-size="15" fill="#d7e8e0">Learn More</text>

  <!-- Shield card -->
  <rect x="880" y="160" width="330" height="330" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="1045" cy="240" r="42" fill="#0b2230"/>
  <circle cx="1045" cy="240" r="30" fill="url(#shield)"/>
  <path d="M1045 218l14 5v11c0 8.6-5.6 14.4-14 17-8.4-2.6-14-8.4-14-17v-11z" fill="#06251a"/>
  <text x="1045" y="352" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">24/7 Response</text>
  <text x="1045" y="378" text-anchor="middle" font-size="13" fill="#8fb3a4">Always on duty across the state</text>

  <!-- Stats -->
  <rect x="48" y="590" width="384" height="120" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="76" y="640" font-size="30" font-weight="700" fill="#4ade80">Statewide</text>
  <text x="76" y="672" font-size="13" fill="#8fb3a4">Coverage across Ogun State LGAs</text>

  <rect x="448" y="590" width="384" height="120" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="476" y="640" font-size="30" font-weight="700" fill="#4ade80">Trained</text>
  <text x="476" y="672" font-size="13" fill="#8fb3a4">Professional corps personnel</text>

  <rect x="848" y="590" width="384" height="120" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="876" y="640" font-size="30" font-weight="700" fill="#4ade80">Integrated</text>
  <text x="876" y="672" font-size="13" fill="#8fb3a4">Working with security agencies</text>

  <!-- Footer bar -->
  <rect x="0" y="748" width="1280" height="52" fill="#060a12" fill-opacity="0.6"/>
  <text x="48" y="780" font-size="12.5" fill="#6d8d7f">© Ogun State So-Safe Corps · sosafecorps.og.gov.ng</text>
</svg>
